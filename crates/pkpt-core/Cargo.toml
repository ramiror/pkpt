[package]
name = "pkpt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.12.1"
base64 = "0.23.1"
bech32 = "0.12.0"
bip39 = "3.0.0"
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
hkdf = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
